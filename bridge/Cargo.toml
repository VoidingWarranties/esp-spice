[package]
name = "esp-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Runs ESP32 firmware in esp32sim, in lockstep with a circuit simulation"

[dependencies]
emu-core = { git = "https://github.com/mikroverk/esp32sim", rev = "3bdb9582a910974e4e025d274d6ec61e5c481be6" }
esp-periph = { git = "https://github.com/mikroverk/esp32sim", rev = "3bdb9582a910974e4e025d274d6ec61e5c481be6" }
esp-soc = { git = "https://github.com/mikroverk/esp32sim", rev = "3bdb9582a910974e4e025d274d6ec61e5c481be6" }
esp32 = { git = "https://github.com/mikroverk/esp32sim", rev = "3bdb9582a910974e4e025d274d6ec61e5c481be6" }
esp32c3 = { git = "https://github.com/mikroverk/esp32sim", rev = "3bdb9582a910974e4e025d274d6ec61e5c481be6" }
esp32c6 = { git = "https://github.com/mikroverk/esp32sim", rev = "3bdb9582a910974e4e025d274d6ec61e5c481be6" }
esp32s3 = { git = "https://github.com/mikroverk/esp32sim", rev = "3bdb9582a910974e4e025d274d6ec61e5c481be6" }
serde_json = "1"

# The emulator is too slow to boot firmware without optimization.
[profile.dev.package."*"]
opt-level = 3
