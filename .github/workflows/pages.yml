# Builds the web demo with Nix on each pull request, and publishes it to
# GitHub Pages, at <pages URL>/web/, on each push to main.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs the build without Pages access, because build scripts run code from
  # dependencies.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-site-${{ hashFiles('flake.*', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-site-
          gc-max-store-size-linux: 4G
      - run: nix build .#site
      # Lets anyone check that a local build gives the same files.
      - run: sha256sum result/web/dist/*
      - uses: actions/upload-pages-artifact@v5
        with:
          path: result

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-slim
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}web/
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
