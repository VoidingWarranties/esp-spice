# Publishes the web demo to GitHub Pages, at <pages URL>/web/.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}web/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the ESP32 module and get the ROM
        run: tools/build-web.sh
        env:
          # Keeps the build files out of the published folder.
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
      # LGPL-2.1 asks for the Arduino core source in the same place as
      # firmware.bin.
      - name: Get the Arduino-ESP32 source
        run: |
          curl -fsSL --retry 5 -o web/dist/esp32-core-3.3.8.tar.xz \
            https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8.tar.xz
          echo "f7f63825cfb98269514b977ea78c17ab292904e47e1ca47329fbe0ccccc5a83d  web/dist/esp32-core-3.3.8.tar.xz" |
            sha256sum -c
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v5
