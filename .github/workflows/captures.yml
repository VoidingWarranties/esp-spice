# Draws each example circuit, so reviewers can see a pull request's
# changes without pictures in the branch. Download "captures" from the run.
name: Captures

on:
  pull_request:
    paths:
      - examples/**
      - render/**
      # Drawings of parts are in circuit/parts.js.
      - circuit/parts.js
      - tools/capture-examples.sh
      - .github/workflows/captures.yml
      - flake.nix
      - flake.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-captures-${{ hashFiles('flake.*', 'render/package-lock.json') }}
          restore-prefixes-first-match: nix-captures-
          gc-max-store-size-linux: 4G
      - run: nix build .#captures --out-link captures
      - uses: actions/upload-artifact@v7
        with:
          name: captures
          path: captures/
